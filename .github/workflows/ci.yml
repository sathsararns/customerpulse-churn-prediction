name: CustomerPulse checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: customerpulse_test
          POSTGRES_USER: customerpulse
          POSTGRES_PASSWORD: test_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U customerpulse -d customerpulse_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - run: python -m pip install -r requirements-dev.txt -r requirements-streaming.txt -c constraints.txt
      - run: python -m pytest tests -q --junitxml=artifacts/test-results.xml
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://customerpulse:test_password@localhost:5432/customerpulse_test
          PYTHONDONTWRITEBYTECODE: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: backend/artifacts/test-results.xml

  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build

  container-builds:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t customerpulse-backend:local backend
      - run: docker build -t customerpulse-frontend:ci frontend
      - run: docker build -f backend/deployment/airflow/Dockerfile -t customerpulse-orchestration:ci backend
      - name: Validate manual DAG and task dependencies
        run: >-
          docker run --rm --entrypoint python customerpulse-orchestration:ci -c
          "from airflow.dag_processing.dagbag import DagBag; bag=DagBag(dag_folder='/opt/airflow/dags'); assert not bag.import_errors, bag.import_errors; dag=bag.dags['customerpulse_approved_training']; assert len(dag.tasks)==6; assert dag.schedule is None"
      - run: docker compose -f docker-compose.yml -f docker-compose.kafka.yml -f docker-compose.airflow.yml config --quiet
