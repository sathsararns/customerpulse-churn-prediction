version: "3.9"

services:
  backend:
    build:
      context: ./backend
    container_name: customerpulse-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/reports:/app/reports
      - ./backend/artifacts:/app/artifacts
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: customerpulse-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped