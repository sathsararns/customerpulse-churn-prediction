services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: customerpulse-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlflow-data:/mlflow
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
      --allowed-hosts "localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*,customerpulse-mlflow,customerpulse-mlflow:*"
      --cors-allowed-origins "http://localhost:5173,http://127.0.0.1:5173"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: customerpulse-backend
    ports:
      - "8000:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./backend/data:/app/data
      - ./backend/models:/app/models
      - ./backend/reports:/app/reports
      - ./backend/artifacts:/app/artifacts
    depends_on:
      - mlflow
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: customerpulse-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
