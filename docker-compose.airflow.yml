# Manual local orchestration; combine with docker-compose.yml (Kafka optional).
x-orchestration: &orchestration
  image: customerpulse-orchestration:local
  build:
    context: ./backend
    dockerfile: deployment/airflow/Dockerfile
  user: "10001:0"
  environment: &orchestration-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: "1"
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
    AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/config/passwords.json
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:-airflow_local}@orchestration-db:5432/airflow
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET:-customerpulse_local_airflow_secret}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-customerpulse_local_airflow_jwt_secret}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://orchestration:8080/execution/
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: "5"
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-customerpulse_local}
    MLFLOW_TRACKING_URI: http://mlflow:5000
    DATABASE_URL: postgresql+psycopg://customerpulse:${POSTGRES_PASSWORD:-customerpulse_local}@postgres:5432/customerpulse
    GIT_REVISION: ${GIT_REVISION:-}
  volumes:
    - model_artifacts:/app/artifacts
    - model_reports:/app/reports
    - orchestration_logs:/opt/airflow/logs
    - orchestration_config:/opt/airflow/config

services:
  mlflow:
    environment:
      # This project uses tracking/artifact APIs, not MLflow's background job executor.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"

  orchestration-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD:-airflow_local}
    volumes:
      - orchestration_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  orchestration-init:
    <<: *orchestration
    command: ["python", "/opt/airflow/initialize.py"]
    depends_on:
      orchestration-db:
        condition: service_healthy
      orchestration-permissions:
        condition: service_completed_successfully

  orchestration-permissions:
    image: customerpulse-orchestration:local
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 10001:0 /opt/airflow/config /opt/airflow/logs"]
    volumes:
      - orchestration_logs:/opt/airflow/logs
      - orchestration_config:/opt/airflow/config

  orchestration:
    <<: *orchestration
    command: ["standalone"]
    ports:
      - "127.0.0.1:${AIRFLOW_PORT:-8090}:8080"
    depends_on:
      orchestration-init:
        condition: service_completed_successfully
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json; from urllib.request import urlopen; data=json.load(urlopen('http://localhost:8080/api/v2/monitor/health',timeout=5)); assert data['scheduler']['status']=='healthy'"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 20
    restart: unless-stopped

volumes:
  orchestration_postgres_data:
  orchestration_logs:
  orchestration_config:
