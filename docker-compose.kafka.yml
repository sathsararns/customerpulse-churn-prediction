# Opt-in Kafka stack: docker compose -f docker-compose.yml -f docker-compose.kafka.yml up -d
x-stream-env: &stream-env
  DATABASE_URL: postgresql+psycopg://customerpulse:${POSTGRES_PASSWORD:-customerpulse_local}@postgres:5432/customerpulse
  KAFKA_BOOTSTRAP_SERVERS: stream-broker:9092
  KAFKA_CUSTOMER_TOPIC: customer-events
  KAFKA_PREDICTION_TOPIC: churn-predictions
  KAFKA_DEAD_LETTER_TOPIC: customerpulse-dead-letter
  KAFKA_INFERENCE_GROUP: customerpulse-inference-v1
  KAFKA_ANALYTICS_GROUP: customerpulse-analytics-v1
  STREAM_MAX_ATTEMPTS: "3"

services:
  stream-volume-init:
    image: apache/kafka:3.9.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown 1000:1000 /var/lib/kafka/data"]
    volumes:
      - stream_kafka_data:/var/lib/kafka/data

  stream-broker:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,HOST://:9095
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://stream-broker:9092,HOST://localhost:${KAFKA_PORT:-9095}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@stream-broker:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9095}:9095"
    volumes:
      - stream_kafka_data:/var/lib/kafka/data
    depends_on:
      stream-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      start_period: 30s
      retries: 15
    restart: unless-stopped

  stream-topics:
    image: customerpulse-backend:local
    environment: *stream-env
    command: ["python", "-m", "streaming.setup_topics"]
    depends_on:
      stream-broker:
        condition: service_healthy

  stream-inference:
    image: customerpulse-backend:local
    environment:
      <<: *stream-env
      STREAM_API_URL: http://backend:8000
    command: ["python", "-m", "streaming.inference_service"]
    volumes:
      - model_artifacts:/app/artifacts
    depends_on:
      stream-topics:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    restart: unless-stopped

  stream-analytics:
    image: customerpulse-backend:local
    environment: *stream-env
    command: ["python", "-m", "streaming.analytics_service"]
    depends_on:
      stream-topics:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  stream-producer:
    image: customerpulse-backend:local
    profiles: ["replay"]
    environment: *stream-env
    entrypoint: ["python", "-m", "streaming.producer_service"]
    command: ["--limit", "10", "--interval", "0.5"]
    depends_on:
      stream-topics:
        condition: service_completed_successfully
      stream-inference:
        condition: service_started
      stream-analytics:
        condition: service_started

volumes:
  stream_kafka_data:
